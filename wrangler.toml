name = "cauldron-trading-desk"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Seed knowledge (starter strategy, market notes, roles) is bundled as text. D1 is the source of truth at runtime.
rules = [{ type = "Text", globs = ["**/*.md"], fallthrough = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "trading-desk"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
MODE = "paper"
PAPER_START_PUSD = "1000"
GROK_MODEL = "grok-4.7"
JOURNAL_HOUR_UTC = "21"

# Secrets (set with `wrangler secret put`):
#   XAI_API_KEY  - xAI API key for Grok
#   ADMIN_TOKEN  - owner token for the kill switch and manual runs
