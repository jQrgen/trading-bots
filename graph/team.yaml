# Bot team graph. Edges point from an agent to the agent it reports to.
owner: human
loop: [orin, vela, kade, nova, rune, zara]

agents:
  nova:
    role: Head trader / portfolio manager
    horizon: all
    reports_to: human
    can: [read_ledger, read_proposals, approve, reject, set_budgets, write_report]
  orin:
    role: Market scanner
    horizon: short
    reports_to: vela
    can: [indexer_tokens, indexer_candles, indexer_volume, indexer_latest_tx, indexer_first_pool]
  vela:
    role: Research analyst
    horizon: [medium, long]
    reports_to: nova
    can: [grok_search, bcmr_lookup, pool_history, holder_lookup, propose_trade]
  kade:
    role: Risk officer
    horizon: all
    reports_to: nova
    veto: true
    can: [risk_engine, quote_simulate, slippage_calc, rug_check]
  rune:
    role: Executor
    horizon: short
    reports_to: nova
    can: [router_quote, router_build, tx_verify, signer_request, broadcast]
  zara:
    role: Journal, learning and alerts
    horizon: all
    reports_to: [nova, human]
    can: [read_ledger, stats, alert, write_lessons]
