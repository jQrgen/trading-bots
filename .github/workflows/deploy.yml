# On every push to main: check, migrate the D1 database, deploy the Worker,
# then tell the desk what changed so the bots and the website see it.
name: Deploy trading desk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency: deploy-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create or find the D1 database
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "trading-desk") | .uuid')
          if [ -z "$ID" ]; then
            npx wrangler d1 create trading-desk
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "trading-desk") | .uuid')
          fi
          echo "D1 database id: $ID"
          sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/$ID/" wrangler.toml
      - run: npx wrangler d1 migrations apply trading-desk --remote
      - name: Deploy the Worker
        id: deploy
        run: |
          npx wrangler deploy | tee deploy.log
          URL="${{ vars.DESK_URL }}"
          [ -z "$URL" ] && URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Trading desk: $URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Sync secrets to the Worker
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          jq -n '{XAI_API_KEY: env.XAI_API_KEY, ADMIN_TOKEN: env.ADMIN_TOKEN, BOT_TOKEN: env.BOT_TOKEN} | with_entries(select(.value != ""))' > secrets.json
          npx wrangler secret bulk secrets.json
          rm secrets.json
      - name: Tell the desk what changed and run a cycle
        env:
          DESK_URL: ${{ steps.deploy.outputs.url }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | jq -R . | jq -sc . || echo '[]')
          BODY=$(jq -n --arg sha "$GITHUB_SHA" --arg message "${COMMIT_MESSAGE:-manual deploy}" --argjson files "$FILES" \
            '{sha: $sha, message: $message, files: $files}')
          # New secrets take a few seconds to reach the Worker, so retry.
          for i in 1 2 3 4 5 6; do
            curl -fsS -X POST "$DESK_URL/api/admin/deployed" \
              -H "authorization: Bearer $ADMIN_TOKEN" -H "content-type: application/json" --data "$BODY" && break
            [ $i = 6 ] && exit 1
            sleep $((i * 5))
          done
          curl -fsS -X POST "$DESK_URL/api/admin/run" -H "authorization: Bearer $ADMIN_TOKEN"
          sleep 20
          echo "Desk state after the first cycle:"
          curl -fsS "$DESK_URL/api/state" | jq -c '{mode, halted, total_pusd, agents: [.agents[]? | {agent, status}]}' || true
          curl -fsS "$DESK_URL/api/events?limit=10" | jq -r '.[] | "\(.agent) \(.kind): \(.message)"' || true
