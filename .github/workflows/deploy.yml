# On every push to main: check, migrate the D1 database, deploy the Worker,
# then tell the desk what changed so the bots and the website see it.
name: Deploy trading desk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Use the real D1 database id
        run: sed -i "s/REPLACE_WITH_ID_FROM_wrangler_d1_create/${{ secrets.D1_DATABASE_ID }}/" wrangler.toml
      - run: npx wrangler d1 migrations apply trading-desk --remote
      - run: npx wrangler deploy
      - name: Notify the desk
        env:
          DESK_URL: ${{ vars.DESK_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | jq -R . | jq -sc . || echo '[]')
          jq -n --arg sha "$GITHUB_SHA" --arg message "${COMMIT_MESSAGE:-manual deploy}" --argjson files "$FILES" \
            '{sha: $sha, message: $message, files: $files}' |
          curl -fsS -X POST "$DESK_URL/api/admin/deployed" \
            -H "authorization: Bearer $ADMIN_TOKEN" -H "content-type: application/json" --data @-
